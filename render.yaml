# Render Blueprint for «بعد مأرب». Free web service in Frankfurt, next to Neon (aws-eu-central-1).
# NO SECRETS IN THIS FILE: every secret is `sync: false`, so Render asks for it in the dashboard.
# Not deployed yet. DevOps sets up Neon and fills the values.
# No preview environments (root-level `previews.generation: off`). Per-service PR previews are
# disabled by omitting `previews` on the service (that field only accepts manual/automatic).
previews:
  generation: "off" # quoted: a bare off is YAML 1.1 boolean false
services:
  - type: web
    name: baad-marib
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: false
    # The build runs the migrations (scripts/migrate.mjs) on DATABASE_URL_UNPOOLED (falls back to DATABASE_URL),
    # so the database values must be set before the first deploy.
    buildCommand: npm ci && npm run build
    # Checks DATABASE_URL / BETTER_AUTH_SECRET / BETTER_AUTH_URL first and exits 1 if any is missing.
    startCommand: node scripts/start.mjs
    # Runs `select 1`: 200 "ok", or 503 when the database is unreachable.
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_ENV
        value: production
      # Client IP = the X-Forwarded-For entry this many places from the right. On Render the chain
      # ends "<client>, <Cloudflare edge>, <Render LB>", so 3. CF-Connecting-IP is not used.
      # Docs: https://render.com/articles/how-render-handles-ddos-attacks ("Reading the true client IP").
      - key: TRUST_PROXY_HOPS
        value: "3"
      # Neon Frankfurt, pooled endpoint ("-pooler" host) with ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Neon Frankfurt, DIRECT (non-pooler) endpoint. Used ONLY by the migration runner during the build.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # 32+ random characters. Required: the server will not start without it.
      - key: BETTER_AUTH_SECRET
        sync: false
      # Public https URL of the service, e.g. https://baad-marib.onrender.com. Required.
      - key: BETTER_AUTH_URL
        sync: false
      # Owner's address. The account must also be verified once (docs/deploy.md).
      - key: ADMIN_EMAIL
        sync: false
